name = "ai-desk-animation-api"
main = "worker/index.js"
compatibility_date = "2026-10-02"

[vars]
OPENAI_MODEL = "gpt-5-mini"
STORE_ORIGINAL_INO = "false"
# Configure these as Worker secrets/environment values before deployment:
# ADMIN_TOKEN
# DEVICE_TOKEN
# OPENAI_API_KEY
# GITHUB_TOKEN
# GITHUB_OWNER
# GITHUB_REPO
# GITHUB_BRANCH

# Global Draw Pad relay: one SQLite-backed Durable Object coordinates the
# authenticated ESP32 WebSocket and short-lived browser sessions.
[[durable_objects.bindings]]
name = "DRAW_PAD_RELAY"
class_name = "DrawPadRelay"

[[migrations]]
tag = "drawpad-relay-v1"
new_sqlite_classes = ["DrawPadRelay"]
